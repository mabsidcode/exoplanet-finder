[theme]
base = "dark"
primaryColor = "#8fb3ff"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#131a2c"
textColor = "#e4e8f1"
font = "sans serif"

[server]
maxUploadSize = 25
headless = true

[client]
# hide developer-only menu items (e.g. "Deploy") in the public demo
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
